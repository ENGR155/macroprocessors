project:
  type: website
  output-dir: _site
  render:
    - '*.qmd'
    - 'docs/*.qmd'
  resources:
    - assets/**
    - hardware/**
    - firmware/**
    - fpga/rtl/**
    - fpga/tb/**
    - fpga/constraints/**
    - data/results/**
    - tools/calibrate.py
    - tests/**
website:
  title: 'FIELD / 155'
  description: 'Hall-sensed magnetic levitation. An ENGR 155 project exploring feedback, embedded control, and FPGA design.'
  favicon: assets/favicon.svg
  navbar:
    background: light
    collapse-below: lg
    title: "FIELD <span class='brand-slash'>/</span> 155"
    left:
      - href: index.qmd
        text: Overview
      - text: Design
        menu:
          - href: design.qmd
            text: System architecture
          - href: mcu.qmd
            text: MCU design
          - href: fpga.qmd
            text: FPGA design
          - href: hardware.qmd
            text: Hardware & materials
      - href: documentation.qmd
        text: Documentation
      - href: results.qmd
        text: Results
      - href: about.qmd
        text: About
    right:
      - href: docs/build.qmd
        text: Build guide
  search:
    location: navbar
    type: overlay
  page-footer:
    left: 'FIELD / 155 · Hall-sensed magnetic levitation'
    center: 'Harvey Mudd College · ENGR 155'
    right:
      - href: references.qmd
        text: References
      - href: ai.qmd
        text: AI use
format:
  html:
    theme: [cosmo, assets/theme.scss]
    css: assets/site.css
    toc: true
    toc-title: On this page
    code-copy: true
    code-overflow: wrap
    html-math-method: mathml
    link-external-newwindow: true
    smooth-scroll: false
    include-before-body: assets/before-body.html
    include-after-body: assets/after-body.html
    filters:
      - assets/doc-links.lua
    lang: en
    title-prefix: 'FIELD / 155'
