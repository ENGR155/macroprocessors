project:
  type: website
  output-dir: _site
  render:
    - '*.qmd'
    - 'docs/*.qmd'
  resources:
    - assets/**
    - hardware/**
    - firmware/**
    - fpga/rtl/**
    - fpga/tb/**
    - fpga/constraints/**
    - data/results/**
    - tools/calibrate.py
    - tests/**
website:
  title: 'E155 Magnetic Levitation'
  description: 'Magnetic levitation project for ENGR 155 by Stephen Kanti Mahanty and Ben Lertwachara.'
  navbar:
    background: light
    collapse-below: lg
    title: 'E155 Project'
    left:
      - href: index.qmd
        text: Home
      - text: Design
        menu:
          - href: design.qmd
            text: System Design
          - href: mcu.qmd
            text: MCU Design
          - href: fpga.qmd
            text: FPGA Design
          - href: hardware.qmd
            text: Hardware
      - href: documentation.qmd
        text: Documentation
      - href: results.qmd
        text: Results
      - href: about.qmd
        text: About
  search:
    location: navbar
    type: overlay
  page-footer:
    left: 'Stephen Kanti Mahanty and Ben Lertwachara · ENGR 155'
    right:
      - href: references.qmd
        text: References
      - href: ai.qmd
        text: AI use
format:
  html:
    theme: [cosmo, assets/theme.scss]
    css: assets/site.css
    toc: true
    toc-title: On this page
    code-copy: true
    code-overflow: wrap
    html-math-method: mathml
    link-external-newwindow: true
    smooth-scroll: false
    include-before-body: assets/before-body.html
    include-after-body: assets/after-body.html
    filters:
      - assets/doc-links.lua
    lang: en
    title-prefix: 'E155 Magnetic Levitation'
